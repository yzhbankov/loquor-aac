[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "loquor-aac"
version = "0.6.0"
description = "loquor — AI agents on separate devices that discover each other and work together offline, over Wi-Fi or Bluetooth"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "Apache-2.0" }
keywords = ["agents", "a2a", "offline", "edge", "local-first", "bluetooth", "ollama"]
dependencies = [
    "aiohttp>=3.9",
    "cbor2>=5.6",
    "jsonschema>=4.17",
    "pynacl>=1.5",
]

[project.scripts]
loquor = "loquor.cli:main"

[project.optional-dependencies]
dev = [
    "pytest>=8",
    "pytest-asyncio>=0.23",
]
ble = [
    "bleak>=0.22",
    "bless>=0.2.6",
]
hw = [
    "gpiozero>=2.0",
    "pyserial>=3.5",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
loquor = ["profile.schema.json"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
