[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "loquor-aac"
version = "0.3.0"
description = "loquor — offline agent-to-agent communication over local transports (Wi-Fi/IP today; BLE, UWB and mesh planned)"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "Apache-2.0" }
keywords = ["agents", "a2a", "offline", "mdns", "edge", "local-first"]
dependencies = [
    "aiohttp>=3.9",
    "cbor2>=5.6",
    "jsonschema>=4.17",
    "pynacl>=1.5",
]

[project.scripts]
loquor = "loquor.cli:main"

[project.optional-dependencies]
dev = [
    "pytest>=8",
    "pytest-asyncio>=0.23",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
