name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install
        run: pip install -e ".[dev]"
      - name: Test
        run: python -m pytest -v

  install-script:
    # The path a new device takes: install.sh, then doctor, check and init.
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - name: install.sh (no Ollama on CI)
        run: ./install.sh --no-ollama --yes
      - name: doctor
        run: .venv/bin/loquor doctor --no-llm
      - name: check the demo profiles
        run: |
          .venv/bin/loquor check demo/weather_and_clothes/weather_agent.json --no-llm
          .venv/bin/loquor check demo/triage/nurse_agent.json --no-llm
          .venv/bin/loquor check demo/greenhouse/controller.json --no-llm
      - name: a sensor node runs with no LLM at all
        run: |
          .venv/bin/loquor config set llm false
          .venv/bin/loquor doctor --transport localhost
          .venv/bin/loquor check demo/greenhouse/node_soil.json
          .venv/bin/loquor run demo/greenhouse/node_soil.json --transport localhost & pid=$!
          sleep 8
          .venv/bin/loquor status "Soil Node"
          kill -INT $pid; wait $pid
          .venv/bin/loquor config set llm true
      - name: init, check and run a starter agent for 10 s
        run: |
          .venv/bin/loquor init /tmp/starter --name "CI Agent"
          .venv/bin/loquor check /tmp/starter/agent.json --no-llm
          .venv/bin/python - <<'PY'
          import json, pathlib
          p = pathlib.Path("/tmp/starter/agent.json"); d = json.loads(p.read_text())
          d["reasoner"] = {"type": "template"}          # no Ollama on CI
          p.write_text(json.dumps(d, indent=2))
          PY
          .venv/bin/loquor run /tmp/starter/agent.json --transport localhost & pid=$!
          sleep 10
          .venv/bin/loquor status "CI Agent"
          kill -INT $pid; wait $pid
